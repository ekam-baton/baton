events {
    worker_connections 1024;
}

http {
    # Rate Limiting Zone: Max 30 requests per minute per IP
    limit_req_zone $binary_remote_addr zone=baton_limit:10m rate=30r/m;
    limit_req_status 429;

    server {
        listen 443 ssl http2;
        server_name api.baton.ai;

        # TLS / SSL Certificate Configuration
        ssl_certificate /etc/letsencrypt/live/api.baton.ai/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.baton.ai/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Reverse Proxy to Rust Gateway Engine (Port 8080)
        location / {
            limit_req zone=baton_limit burst=5 nodelay;

            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;

            # WebSockets support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;

            # Forward original client IP for rate-limiting
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Block direct external access to internal tool server
        location /tool-api/ {
            return 403 "Forbidden";
        }
    }
}
