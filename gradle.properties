# Project-wide Gradle settings
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=false

# Android
android.useAndroidX=true
android.enableJetifier=false

# Kotlin
kotlin.code.style=official

# Compose
android.defaults.buildfeatures.compose=true

# Prevent Kotlin daemon crashes
kotlin.compiler.execution.strategy=in-process

# Release Signing (git-ignored in production — use env vars in CI)
BATON_KEYSTORE_FILE=../release.jks
BATON_KEYSTORE_PASSWORD=BatonRelease2026Secure
BATON_KEY_ALIAS=baton-release
BATON_KEY_PASSWORD=BatonRelease2026Secure
