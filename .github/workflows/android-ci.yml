name: BATON Mobile & Multiplatform CI/CD

on:
  push:
    branches: [ "main", "develop" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Android NDK & cargo-ndk
        run: |
          ANDROID_NDK_PATH=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$ANDROID_NDK_PATH" ]; then
            echo "ANDROID_NDK_HOME=$ANDROID_NDK_PATH" >> $GITHUB_ENV
          fi
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android || true
          cargo install cargo-ndk || true

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Run Android Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
