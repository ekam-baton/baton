name: BATON Mobile App CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Run Android Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk

  build-ios:
    name: Build iOS XCFramework
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Shared iOS XCFramework
        run: ./gradlew :core:network:assembleBatonNetworkXCFramework --no-daemon

      - name: Upload iOS XCFramework Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BatonNetwork.xcframework
          path: core/network/build/XCFrameworks/debug/BatonNetwork.xcframework

  build-desktop-macos:
    name: Build macOS Desktop Hub
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Build macOS Desktop Engine
        run: |
          cd gateway-engine
          cargo build --release --target aarch64-apple-darwin

      - name: Upload macOS Desktop Binary
        uses: actions/upload-artifact@v4
        with:
          name: baton-gateway-engine-macos
          path: gateway-engine/target/aarch64-apple-darwin/release/baton-gateway-engine

  build-desktop-windows:
    name: Build Windows Desktop Hub
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Windows Desktop Engine
        run: |
          cd gateway-engine
          cargo build --release

      - name: Upload Windows Desktop Binary
        uses: actions/upload-artifact@v4
        with:
          name: baton-gateway-engine-windows.exe
          path: gateway-engine/target/release/baton-gateway-engine.exe

